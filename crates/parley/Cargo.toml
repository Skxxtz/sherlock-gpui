[package]
name = "parley"
version = "0.1.0"
edition = "2024"
description = "Small trained intent + slot parser for launcher commands"

[dependencies]

[features]
# training-only code (data generator, trainer); never needed at runtime
training = []

[[bin]]
name = "parley-train"
path = "src/bin/parley-train.rs"
required-features = ["training"]
