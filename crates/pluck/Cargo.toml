[package]
name = "pluck"
version = "0.1.0"
edition = "2024"
publish = false
description = "Extract typed values from loosely structured JSON using paths."

[features]
default = ["derive"]
derive = ["dep:pluck-derive"]

[dependencies]
serde_json = "1.0.149"
pluck-derive = { path = "pluck-derive", optional = true }
