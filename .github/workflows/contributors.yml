name: contributors

# Regenerates `assets/contributors.rs` from the release branch's history, so every build
# bundles the contributors of the code it was built from. No network at build time.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contributor list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          out=assets/contributors.rs
          {
            echo "// @generated by .github/workflows/contributors.yml; do not edit."
            echo "&["
            # commits per GitHub user on this branch, most first; bots and unlinked emails skipped
            gh api "repos/$REPO/commits?sha=$BRANCH&per_page=100" --paginate \
              -q '.[] | .author | select(. != null and .type == "User") | .login' |
            sort | uniq -c | sort -k1,1nr -k2,2 |
            while read -r commits login; do
              name=$(gh api "users/$login" -q '.name // .login')
              jq -rn --arg login "$login" --arg name "$name" --argjson commits "$commits" \
                '"    Contributor { login: \($login | @json), name: \($name | @json), commits: \($commits) },"'
            done
            echo "]"
          } > "$out"
          cat "$out"

      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update contributors [skip ci]"
          git push
